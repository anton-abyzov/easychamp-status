name: Manage incident
on:
  workflow_dispatch:
    inputs:
      incident_id:
        description: Existing confirmed incident ID from the public status page
        required: true
        type: string
      stage:
        description: Owner update; recovery is confirmed automatically by observations
        required: true
        type: choice
        options: [investigating, identified, monitoring, writeup_published]
      message:
        description: Reviewed public-safe update, one paragraph (maximum 1200 characters)
        required: true
        type: string
      postmortem_url:
        description: Reviewed public HTTPS write-up URL, required only for writeup_published
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: independent-status
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
      issues: write
      actions: write
    env:
      PWDEBUG: '0'
      PLAYWRIGHT_HTML_OPEN: never
      GITHUB_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test && npm run check
      - name: Authorize collaborator and apply validated owner update
        run: node scripts/incidents-owner.mjs
      - name: Synchronize the confirmed incident issue
        id: incidents
        continue-on-error: true
        run: node scripts/incidents-sync.mjs
      - name: Record retryable incident issue synchronization failure
        if: steps.incidents.outcome == 'failure'
        run: echo '::warning::Incident issue synchronization unavailable; the owner update will be preserved and retried by the monitor.'
      - name: Commit public incident update
        run: |
          git config user.name 'EasyChamp Status'
          git config user.email 'status@users.noreply.github.com'
          git add data/incidents.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record reviewed incident update'
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
      - name: Request fresh collection and public Pages publication
        run: gh workflow run status.yml --ref "$DEFAULT_BRANCH"
