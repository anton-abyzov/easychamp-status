name: Collect and publish service status
on:
  workflow_dispatch:
  schedule:
    - cron: '3-58/5 * * * *'
    - cron: '2,17,32,47 * * * *'
  push:
    branches: [main]
    paths-ignore: ['data/**', 'history/**', 'README.md']
permissions:
  contents: read
concurrency:
  group: independent-status
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      issues: write
    env:
      PWDEBUG: '0'
      PLAYWRIGHT_HTML_OPEN: never
    outputs:
      artifact: ${{ steps.upload.outputs.artifact_id }}
      observed_at: ${{ steps.collect.outputs.observed_at }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate public code and contracts
        run: npm test && npm run check
      - name: Install headless browser for rendering pass
        if: github.event_name != 'schedule' || github.event.schedule == '2,17,32,47 * * * *'
        run: npx playwright install --with-deps chromium
      - name: Generate strict Upptime configuration
        run: node scripts/upptime-config.mjs
        env:
          STATUS_MONITOR_TOKEN: ${{ secrets.STATUS_MONITOR_TOKEN }}
      - name: Persist Upptime endpoint history and issues
        uses: upptime/uptime-monitor@8be193bbcb957a3a917d2bb16a0c96959778a889 # v1.44.1
        with:
          command: update
        env:
          GH_PAT: ${{ github.token }}
          SECRETS_CONTEXT: '{"STATUS_MONITOR_TOKEN":${{ toJson(secrets.STATUS_MONITOR_TOKEN) }}}'
      - name: Collect functional, destination and optional headless rendering evidence
        id: collect
        run: |
          if [ "$RUN_BROWSER" = 'true' ]; then
            node scripts/collect.mjs --browser
          else
            node scripts/collect.mjs
          fi
        env:
          STATUS_MONITOR_TOKEN: ${{ secrets.STATUS_MONITOR_TOKEN }}
          RUN_BROWSER: ${{ github.event_name != 'schedule' || github.event.schedule == '2,17,32,47 * * * *' }}
          NEW_RELIC_STATUS_LICENSE_KEY: ${{ secrets.NEW_RELIC_STATUS_LICENSE_KEY }}
          NEW_RELIC_STATUS_ACCOUNT_ID: ${{ vars.NEW_RELIC_STATUS_ACCOUNT_ID }}
      - name: Keep timestamped history
        run: |
          git config user.name 'EasyChamp Status'
          git config user.email 'status@users.noreply.github.com'
          git add data .upptimerc.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Record service status observations'
            git push origin HEAD:main
          fi
      - run: npm run build
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        id: upload
        with:
          path: dist
  publish:
    needs: monitor
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
      - name: Verify fresh public state and publish successful-deployment heartbeat
        run: node scripts/publication.mjs --published
        env:
          STATUS_PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          STATUS_GENERATED_AT: ${{ needs.monitor.outputs.observed_at }}
          NEW_RELIC_STATUS_LICENSE_KEY: ${{ secrets.NEW_RELIC_STATUS_LICENSE_KEY }}
          NEW_RELIC_STATUS_ACCOUNT_ID: ${{ vars.NEW_RELIC_STATUS_ACCOUNT_ID }}
