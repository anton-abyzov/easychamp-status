name: Keep status publication on time
# GitHub drops or delays scheduled runs by 15-70 minutes, which trips the
# 20-minute publication heartbeat alert. This job fills those gaps: it starts
# status.yml only when no fresh run exists (a run stuck queued or in progress
# for more than ten minutes no longer counts), then hands over to a fresh copy
# of itself. The pacer holds its own concurrency group for at most 25 minutes
# (the 10-minute cron normally supersedes it sooner, and the handover step
# still runs on cancel), and a newer pacer cancels a hung one, so a stalled runner cannot silence
# publication. It never shares status.yml's group, so it cannot delay it.
on:
  workflow_dispatch:
  schedule:
    - cron: '9,19,29,39,49,59 * * * *'
permissions:
  contents: read
concurrency:
  group: status-pacer
  cancel-in-progress: true
jobs:
  pace:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Start status runs that the schedule missed
        run: |
          end=$(( $(date +%s) + 20 * 60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            if ! latest=$(timeout 30 gh run list --workflow status.yml --limit 1 --json createdAt,status --jq '.[0] // {} | [.createdAt // "", .status // ""] | @tsv'); then
              echo '::warning::Run list unavailable; retrying next minute.'
              sleep 60
              continue
            fi
            created=$(printf '%s' "$latest" | cut -f1)
            state=$(printf '%s' "$latest" | cut -f2)
            if ! decision=$(node scripts/pacer-decision.mjs "$created" "$state") || [ -z "$decision" ]; then
              echo '::warning::Decision script failed; dispatching.'
              decision='dispatch unknown script-error'
            fi
            read -r verdict age reason <<<"$decision"
            if [ "$verdict" = dispatch ]; then
              browser=false
              if [ $(( 10#$(date -u +%M) % 15 )) -lt 5 ]; then browser=true; fi
              echo "Last status run ${age}s ago (${state:-none}, $reason); starting one (browser=$browser)."
              timeout 30 gh workflow run status.yml --ref main -f browser="$browser" || echo '::warning::Dispatch failed; retrying next minute.'
            fi
            sleep 60
          done
      - name: Hand over to the next pacer
        if: always()
        run: |
          for attempt in 1 2 3 4 5; do
            if timeout 30 gh workflow run pacer.yml --ref main; then exit 0; fi
            echo "::warning::Handover attempt $attempt failed."
            sleep 20
          done
          exit 1
